# فقط برای Codespaces — سرویس‌ها داخل خود Codespace اجرا می‌شوند
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: together
      POSTGRES_PASSWORD: together
      POSTGRES_DB: together
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U together"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://together:together@postgres:5432/together
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
